<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Information</title>
</head>

<body>
    <h2>Applicant Information</h2>

    <style>
        input{
            width:"1000px";
            box-sizing: border-box;
        }
        form{
            width:1000px;
        }
    </style>

    <form action="">

        <fieldset>

            <legend>Personal Information</legend>

            <label for="">Name:</label><br><br>

            <select name="" id="">

                <option value="">Mr</option>

                <option value="">Mrs</option>

                <option value="">Ms</option>

            </select>

            <input type="text" placeholder="Enter your first name">

            <input type="text" placeholder="Enter your last name">

            <br><br><br>

            <label for="">Address:</label><br><br>

            <input type="text" placeholder="Enter address line1" width="100%"><br><br>

            <input type="text" placeholder="Enter address line2"><br><br>

            <input type="text" placeholder="State/province">

            <input type="text" placeholder="City"><br><br>

            <input type="text" placeholder="PIN CODE">

            <br><br>

            <label for="">Email:</label><br><br>

            <input type="email" placeholder="Enter your email address" required><br><br>

            <br><br>

            <label for="">Phone number:</label><br><br>

            <input type="number" placeholder="Enter your mobile number"><br><br>

            <br><br>


        </fieldset>

    </form>

</body>

</html>
