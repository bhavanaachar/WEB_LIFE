<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>

<body>

<h1>My feedback form</h1>

<form>

    <ul>
        <li>
            <label>Name:</label>
            <input type="text" name="name"><br><br>
        </li>

        <li>
            <label>Email:</label>
            <input type="email" name="email"><br><br>
        </li>

        <li>
            <label>Password:</label>
            <input type="password" name="password">
        </li>

        <br>

        <li>
            <label>Please check all the emotions that apply to you:</label>
            <ul>
                <li>
                    <label>Angry</label>
                    <input type="checkbox" name="emotion" value="angry"><br>
                </li>
                <li>
                    <label>Sad</label>
                    <input type="checkbox" name="emotion" value="sad"><br>
                </li>
                <li>
                    <label>Happy</label>
                    <input type="checkbox" name="emotion" value="happy"><br>
                </li>
                <li>
                    <label>Ambivalent</label>
                    <input type="checkbox" name="emotion" value="ambivalent"><br>
                </li>
            </ul>
        </li>

        <li>
            <label>How satisfied were you with our service?</label>
            <ul>
                <li>
                    <label>Very satisfied</label>
                    <input type="radio" name="satisfaction" value="very-satisfied"><br>
                </li>
                <li>
                    <label>Satisfied</label>
                    <input type="radio" name="satisfaction" value="satisfied"><br>
                </li>
                <li>
                    <label>Didn't care</label>
                    <input type="radio" name="satisfaction" value="didnt-care"><br>
                </li>
                <li>
                    <label>Dissatisfied</label>
                    <input type="radio" name="satisfaction" value="dissatisfied"><br>
                </li>
                <li>
                    <label>Very dissatisfied</label>
                    <input type="radio" name="satisfaction" value="very-dissatisfied"><br>
                </li>
            </ul>
        </li>

        <li>
            <label>Further comments:</label><br>
            <br>
            <textarea rows="5" cols="35"></textarea><br>
        </li>

        <br>

        <li>
            <label>Bio photo:</label><br><br>
            <input type="file"><br>
        </li>
        <br>

        <li>
            <label>Location visited:</label><br><br>
            <select>
                <option>Select location</option><br>
                <option>India</option><br><br>
                <option>USA</option><br><br>
                <option>UK</option><br><br>
            </select>
        </li>

        <br>

        <li>
            <input type="submit" value="Submit"><br>
        </li>
    </ul>

</form>

</body>
</html>
