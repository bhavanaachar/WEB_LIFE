
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {
            margin: 0;
        }

        .page1, .page2, .page3, .page4 {
            height: 100vh;
            width: 100vw;
            border: 3px solid black;
            box-sizing: border-box;
        }

        /* Chatbot Icon */
        .chatbot {
            position: fixed;
            bottom: 20px;
            right: 20px;
            height: 70px;
            width: 70px;
        }

        .chatbot img {
            height: 70px;
            width: 70px;
        }

        /* Help Message */
        .help-message {
            position: fixed;
            bottom: 35px;
            right: 100px;

            background-color: white;
            border: 1px solid black;
            border-radius: 20px;

            padding: 10px 18px;

            font-family: Arial, sans-serif;
            font-size: 16px;

            box-shadow: 0px 2px 8px gray;
        }

    </style>
</head>

<body>

    <div class="page1">
        <h1>Page 1</h1>
    </div>

    <div class="page2">
        <h1>Page 2</h1>
    </div>

    <div class="page3">
        <h1>Page 3</h1>
    </div>

    <div class="page4">
        <h1>Page 4</h1>
    </div>


    <!-- Help Message -->
    <div class="help-message">
        May I help you?
    </div>

    <!-- Chatbot -->
    <div class="chatbot">
        <img src="https://assets-v2.lottiefiles.com/a/decf4a3e-f47e-11ef-9a9d-2386c1245eb1/LY89s3JCNl.gif">
    </div>

</body>

</html>
