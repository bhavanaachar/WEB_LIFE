<!DOCTYPE html>
<html>
<head>
    <title>Document</title>

    <style>

        .outer {
            width: 600px;
            height: 500px;
            border: 3px solid black;
            position: relative;
        }

        .box {
            width: 50px;
            height: 50px;
            border: 2px solid black;
            position: absolute;
        }

        /* Top */

        .box1 {
            top: 30px;
            left: 275px;
        }

        /* Upper left */

        .box2 {
            top: 90px;
            left: 180px;
        }

        /* Upper right */

        .box3 {
            top: 90px;
            right: 180px;
        }

        /* Middle left */

        .box4 {
            top: 160px;
            left: 180px;
        }

        /* Middle right */

        .box5 {
            top: 160px;
            right: 180px;
        }

        /* Lower left */

        .box6 {
            top: 230px;
            left: 180px;
        }

        /* Lower right */

        .box7 {
            top: 230px;
            right: 180px;
        }

        /* Bottom */

        .box8 {
            bottom: 150px;
            left: 275px;
        }

    </style>
</head>

<body>

    <div class="outer">

        <div class="box" id="box1"><img src=" "></div>
        <div class="box box2"><img src=" " height="100" width="100"></div>
        <div class="box box3"><img src=" " height="100" width="100"></div>
        <div class="box box4"><img src=" " height="100" width="100"></div>
        <div class="box box5"><img src=" " height="100" width="100"></div>
        <div class="box box6"><img src=" " height="100" width="100"></div>
        <div class="box box7"><img src=" " height="100" width="100"></div>
        <div class="box box8"><img src=" " height="100" width="100"></div>

    </div>

</body>
</html>
