<!DOCTYPE html>
<html>
<head>
    <title>Document</title>

    <style>

        .outer {
            width: 800px;
            height: 600px;
            border: 3px solid black;

            position: relative;
        }

        .inner {
            width: 550px;
            height: 400px;
            border: 3px solid black;

            position: absolute;
            top: 100px;
            left: 120px;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 2px solid black;

            position: absolute;
        }

        /* Outer boxes */

        .box6 {
            top: 0;
            left: 0;
        }

        .box7 {
            top: 0;
            right: 0;
        }

        .box8 {
            bottom: 0;
            left: 0;
        }

        .box9 {
            bottom: 0;
            right: 0;
        }

        /* Inner boxes */

        .box1 {
            top: 0;
            left: 225px;
        }

        .box2 {
            top: 150px;
            left: 0;
        }

        .box3 {
            bottom: 0;
            left: 225px;
        }

        .box4 {
            top: 150px;
            right: 0;
        }

        .box5 {
            top: 150px;
            left: 225px;
        }

    </style>
</head>

<body>

    <div class="outer">

        <div class="box box6">6</div>
        <div class="box box7">7</div>
        <div class="box box8">8</div>
        <div class="box box9">9</div>

        <div class="inner">

            <div class="box box1">1</div>
            <div class="box box2">2</div>
            <div class="box box3">3</div>
            <div class="box box4">4</div>
            <div class="box box5">5</div>

        </div>

    </div>

</body>
</html>
